name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        run: mix format --check-formatted

      - name: Run tests
        run: mix test

  # The job above always has every optional dependency installed, so nothing
  # there notices when library code starts to require one — and no release
  # before 0.8.3 compiled without ash_typescript (#31), nor before 0.8.4
  # without swoosh. This builds ash_dispatch the way an app with none of them
  # does, warnings included. Pinned to our own mix.lock, so an upstream
  # release cannot fail it.
  compile-without-optional-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ash_dispatch

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'

      - name: Compile as the only dependency of an app
        run: |
          mkdir consumer && cd consumer
          cp ../ash_dispatch/mix.lock .
          cat > mix.exs <<'EOF'
          defmodule Consumer.MixProject do
            use Mix.Project

            def project do
              [app: :consumer, version: "0.1.0", deps: [{:ash_dispatch, path: "../ash_dispatch"}]]
            end
          end
          EOF
          mix deps.get
          mix deps.compile
          mix deps.compile ash_dispatch --force 2>&1 | tee build.log
          ! grep -q "warning:" build.log

  # Until 0.8.4 the installer had never generated a project that compiles,
  # and nothing ran it. This installs into a bare Ash app (no ash_typescript),
  # adds a domain that uses `AshDispatch.Setup`, and requires the result to
  # compile without warnings and to produce migrations.
  installer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ash_dispatch

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'

      - name: Install into a fresh app and compile the result
        run: |
          cp -r ash_dispatch/.github/fixtures/installer_app app
          cd app
          cp ../ash_dispatch/mix.lock .
          mix deps.get
          mix ash_dispatch.install --yes
          cp setup_deliveries.ex lib/demo/
          mix compile --warnings-as-errors
          mix ash.codegen add_ash_dispatch --dry-run
