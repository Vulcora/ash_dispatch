name: Publish to Hex.pm

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.15'
          otp-version: '26'

      - name: Restore dependencies cache
        uses: actions/cache@v3
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Run tests
        run: mix test

      # Pushing main without a version bump must not fail the pipeline —
      # only publish when the version is new on hex.pm.
      - name: Check if version already published
        id: guard
        run: |
          VERSION=$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])' | tail -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if mix hex.package fetch ash_dispatch "$VERSION" -o /tmp/probe.tar 2>/dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "ash_dispatch $VERSION is already on hex.pm — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Hex.pm (public)
        if: steps.guard.outputs.published == 'false'
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      # The docs link every source file to the v<version> tag on GitHub
      # (source_ref in mix.exs), so a release without a tag has dead links.
      - name: Tag the release
        if: steps.guard.outputs.published == 'false'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "v$VERSION already exists — leaving it."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$VERSION — $(git log -1 --format=%s)"
          git push origin "refs/tags/v$VERSION"
